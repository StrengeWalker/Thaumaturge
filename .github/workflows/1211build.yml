name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ] # 当推送到这些分支时触发
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你在Actions页面手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的Ubuntu运行器

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # 检出你的代码

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25' # 根据你的项目要求修改
        distribution: 'temurin' # 使用Eclipse Temurin发行版

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3 # 缓存Gradle依赖，加速构建

    - name: Build with Gradle
      run: ./gradlew build # 执行构建命令

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar # 将构建生成的jar文件上传为可下载的artifact
